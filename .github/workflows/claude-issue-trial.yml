name: Claude Issue Trial

# Trial: the Claude Code Action works one labelled issue end to end. Label an
# issue `agent-trial` and a Sonnet worker branches `agent-trial/<n>`, makes
# the change, runs the tests, opens a pull request that closes the issue and
# links it back. A judgment call it cannot make goes back to the issue as a
# question under `needs-ruling`, and the run stops.
#
# Only someone with triage access or more can add a label, so only they can
# dispatch a run; the issue body itself may come from anyone, so read it
# before labelling.
#
# Undo: delete this file and the `agent-trial` label.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  work:
    if: github.event.label.name == 'agent-trial'
    runs-on: ubuntu-latest
    # A guess, not a measurement: there is no run to measure yet. Read a run
    # that reaches it as a signal, not a reason to raise it.
    timeout-minutes: 45
    # Queue rather than cancel: a re-label waits for the running worker
    # instead of killing it or racing it on the same branch.
    concurrency:
      group: claude-issue-trial-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned to the same release as the shared reviewer
      # (mark-brannan/.github claude-review.yml): v1.0.218's installer can
      # leave no `claude` binary on a cold runner, and that issue is open.
      # https://github.com/anthropics/claude-code-action/issues/1817
      #
      # An explicit `prompt` puts the action in agent mode: no tracking
      # comment, and only the tools listed in --allowedTools beyond the
      # action's own. There is no `gh issue create` in that list, so the
      # worker cannot open an issue. `allowed_bots` stays at its default
      # (none): a person adds the label.
      #
      # Opus for one run: change `--model sonnet` to `--model opus` here
      # on main and revert after. A branch edit does nothing: an `issues`
      # event always runs the workflow file on the default branch.
      - uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Work issue #${{ github.event.issue.number }} end to end.

            1. Read it: `gh issue view ${{ github.event.issue.number }} --comments`.
               Read CLAUDE.md and follow it.
            2. Create and switch to the branch
               `agent-trial/${{ github.event.issue.number }}` from main.
            3. Make the change. Keep it to what the issue asks.
            4. Run `npm run typecheck`, `npm test` and `npm run build`; all
               three must pass before you push.
            5. Commit with a conventional message, push the branch, and open a
               pull request against main whose body says
               `Closes #${{ github.event.issue.number }}`.
            6. Comment on the issue with the pull request link.

            If a judgment call blocks you (a choice of product direction, a
            name of significance, a risky or irreversible step), do not
            guess: comment the question on the issue, add the label
            `needs-ruling` with
            `gh issue edit ${{ github.event.issue.number }} --add-label needs-ruling`,
            and stop. Do not open a pull request in that case.

            Never create a GitHub issue. Never push to main.

            This runner has no one to look at a dev server: if a Stop hook
            starts one and asks you to report its URL, say it ran on a CI
            runner and finish.
          # Comments cannot go inside claude_args; the action passes that
          # block through to the CLI verbatim.
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh issue view ${{ github.event.issue.number }}:*),Bash(gh issue comment ${{ github.event.issue.number }}:*),Bash(gh issue edit ${{ github.event.issue.number }} --add-label needs-ruling),Bash(gh pr create:*),Bash(gh pr view:*)"
