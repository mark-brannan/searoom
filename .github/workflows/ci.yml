name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Refuses to call an empty PR green: a branch whose tree equals its base at
  # the merge base (a stray commit reverted it) merges cleanly and lands
  # nothing. Listed in ci-gate's needs, so it needs no ruleset entry.
  nonempty:
    # The reusable workflow checks out the repo to diff against base, so it
    # needs contents: read -- the least it can be granted and still run.
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  prose-budget:
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main
    with:
      require-config: false

  ci-gate:
    needs: [check, nonempty, prose-budget]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
