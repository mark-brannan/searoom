name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: i18n catalogs
        run: npm run i18n:check
      - run: npm run build
      - name: Bundle budget
        run: node scripts/bundle-budget.mjs

  # Click-through of every mode and one threshold crossing on the built site
  # (scripts/e2e.mjs), chromium only. A measurement of the site, not a gate,
  # so it stays out of ci-gate's needs until it has a track record.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve dist and run the click-through
        run: |
          npx vite preview --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/searoom/ > /dev/null && break
            sleep 1
          done
          node scripts/e2e.mjs

  # Screenshot goldens (scripts/goldens.mjs): every mode's default state plus
  # three sandbox states, dark, at 1280 and 360 px. Fails when a shot differs
  # from screenshots/goldens by more than 0.1% of pixels. goldens-out/ (the
  # actual renders, plus red-mask diff-*.png for failures) is uploaded either
  # way; on a deliberate change, copy the renders over screenshots/goldens in
  # the update commit. A measurement, not a gate, so it stays out of ci-gate's
  # needs until it has a track record.
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve dist and compare against the goldens
        run: |
          npx vite preview --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/searoom/ > /dev/null && break
            sleep 1
          done
          node scripts/goldens.mjs check
      # Never re-baselined: the default Sandbox must draw a WebGL canvas
      # whose vessel is seen and dim (searoom#218). Its own step, so its
      # seconds show on the run; runs even when the goldens differ.
      - name: Default Sandbox canvas shows a dim vessel
        if: always()
        run: node scripts/lit-canvas.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-out
          path: goldens-out/
          if-no-files-found: ignore

  # How far each golden under screenshots/goldens moved, base to head: pixel
  # fraction, SSIM and changed regions, as a sticky PR comment, a job summary
  # and an old | new | diff artifact; `goldens-large` on a redesign-sized
  # move. A measurement, not a gate, so it stays out of ci-gate's needs. The
  # engine and its pencil thresholds live in mark-brannan/.github (#218).
  golden-diff:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/golden-diff.yml@main
    with:
      paths: screenshots/goldens/**
      label: goldens-large

  # Refuses to call an empty PR green: a branch whose tree equals its base at
  # the merge base (a stray commit reverted it) merges cleanly and lands
  # nothing. Listed in ci-gate's needs, so it needs no ruleset entry.
  nonempty:
    # The reusable workflow checks out the repo to diff against base, so it
    # needs contents: read -- the least it can be granted and still run.
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # The squash title is the commit release-please reads, so it carries a
  # type: `fix(area): ...`, not `area: ...`.
  pr-title:
    permissions:
      pull-requests: read
    uses: mark-brannan/.github/.github/workflows/pr-title.yml@main

  # A measurement, not a gate, so it stays out of ci-gate's needs. Writes the
  # sticky PR comment, hence pull-requests: write.
  complexity:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/complexity.yml@main

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  ci-gate:
    needs: [check, nonempty, pr-title]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
