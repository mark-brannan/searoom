name: Deploy

# One Pages site, rebuilt whole on every run: main at the root, and each
# holding branch (hold/*) under preview/<slug>/ beside it, listed at preview/.
#
# Pages serves one deployment per repo, so a preview cannot be deployed on its
# own: every run rebuilds main plus every live holding branch into one
# artifact. And the github-pages environment admits deployments from main
# only, so every trigger here runs on main's ref:
#   push to main      a merge; also takes a merged holding branch's preview down
#   workflow_run      CI finished on a push to hold/*; runs on the default
#                     branch, whatever branch CI ran on
#   delete            a hold/* branch deleted; runs on the default branch
#   workflow_dispatch by hand, from main
# The hold/ prefix is spelled in the workflow_run filter, the concurrency
# group and plan's if, and in PREFIX in scripts/preview-sites.mjs.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['hold/**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

# Every run that will deploy shares the pages group; any other run (a delete of
# a non-hold branch, CI's pull_request run on a hold branch, a dispatch off
# main) gets a group of its own, so it can't hold up or replace a deploy. The
# test mirrors plan's `if` below; keep the two in step.
# In flight is never cancelled: a run that has started deploying finishes,
# verify-live included. A waiting run is replaced by a newer one, and every
# run rebuilds main at the newest commit, so main's deploy is never lost.
concurrency:
  group: >-
    ${{ (github.ref == 'refs/heads/main' &&
         (github.event_name != 'delete' ||
           (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'hold/'))) &&
         (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == github.repository)))
        && 'pages' || format('pages-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    # workflow_run: only CI's push runs from this repo's own branches, not its
    # pull_request runs (the same push, twice) or a fork's.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'delete' &&
          github.event.ref_type == 'branch' &&
          startsWith(github.event.ref, 'hold/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      previews: ${{ steps.list.outputs.previews }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # If listing fails (an API error), deploy main alone rather than not at
      # all: previews drop out of this one run and come back on the next.
      - id: list
        run: |
          if ! previews=$(node scripts/preview-sites.mjs "$GITHUB_REPOSITORY"); then
            echo "::warning::listing holding branches failed; deploying main without previews"
            previews='[]'
          fi
          echo "previews=$previews" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Re-render the brand images from the built app so og.png tracks the
      # scene, then drop them into dist (vite copied the committed ones).
      # Per-URL previews are impossible on Pages with hash routes: the
      # fragment never reaches the server, so one og.png serves every link.
      - run: npx playwright install --with-deps chromium
        continue-on-error: true
      # Non-fatal: a failed render must not stop main deploying; dist then
      # keeps the committed og.png and apple-touch-icon.png vite copied.
      - name: Render brand images
        continue-on-error: true
        run: |
          npx vite preview --port 4173 &
          pid=$!
          trap 'kill $pid' EXIT
          up=
          for _ in $(seq 30); do
            curl -sf http://localhost:4173/searoom/ >/dev/null && up=1 && break
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error::vite preview never answered on :4173 in 30 s"
            exit 1
          fi
          node scripts/brand-images.mjs
          cp public/og.png public/apple-touch-icon.png dist/
      - uses: actions/upload-artifact@v7
        with:
          name: site-main
          path: dist
          retention-days: 1

  # A broken holding branch drops out of this run's site; it never blocks main.
  # This job runs a holding branch's code in main's context. Only those with
  # write access can push a hold/* branch (preview-sites lists this repo's own
  # branches, never a fork's), and the job is kept bare: a token with no
  # scopes, not left on disk, no secrets, no actions cache restored or saved.
  build-preview:
    needs: plan
    if: needs.plan.outputs.previews != '[]'
    runs-on: ubuntu-latest
    # No scopes at all: the repo is public, so checkout needs none.
    permissions: {}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.previews) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build -- --base="/${REPO_NAME}/preview/${SLUG}/"
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SLUG: ${{ matrix.slug }}
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview-${{ matrix.slug }}
          path: dist
          retention-days: 1

  assemble:
    needs: [plan, build, build-preview]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-main
          path: site
      - uses: actions/download-artifact@v8
        with:
          pattern: site-preview-*
          path: previews
      - name: Place previews under preview/<slug>/
        run: |
          mkdir -p site/preview previews
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width">'
            echo '<title>searoom previews</title><h1>Previews</h1><ul>'
          } > site/preview/index.html
          echo '### Previews' >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEWS" | jq -c '.[]' | while read -r p; do
            slug=$(echo "$p" | jq -r .slug)
            branch=$(echo "$p" | jq -r .branch)
            branch_html=$(echo "$p" | jq -r '.branch | @html')
            sha=$(echo "$p" | jq -r .sha | cut -c1-7)
            if [ -d "previews/site-preview-$slug" ]; then
              mv "previews/site-preview-$slug" "site/preview/$slug"
              echo "<li><a href=\"$slug/\">$branch_html</a> <code>$sha</code></li>" >> site/preview/index.html
              echo "- [$branch]($BASE_URL/preview/$slug/) at \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $branch at \`$sha\`: build failed, not deployed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo '</ul>' >> site/preview/index.html
        env:
          PREVIEWS: ${{ needs.plan.outputs.previews }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the live site
        run: node scripts/verify-live.mjs "$PAGE_URL"
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
